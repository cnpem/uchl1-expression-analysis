# Term registry of expression-analysis: one entry per quantity the skill shows or explains.
#
# This file is the source of the names. `references/glossary.md` is generated from it
# (`expression.py terms --write-glossary`), the pages take their labels from it (scripts/terms.py), and
# `expression.py terms --check` fails when a deprecated name appears in the code or the documentation.
#
# Fields of an entry:
#   id            identifier used in the code (terms.label("<id>"))
#   kind          api (returned by AlphaGenome or the Atlas) | derived (computed by this skill)
#   api           where the value comes from: scorer and column, or the code field for a derived quantity
#   label_pt      the name the researcher reads (Portuguese); short_pt, when present, is for table headers
#   label_en      the name used in the documentation and the code comments
#   definition    one sentence
#   formula       when there is one
#   unit          the unit, or "no official unit"
#   comparable    what the value may be compared with
#   status        official (stated by a source) | skill_convention (this skill's choice) | undecided
#   source        doc and where in it; certainty: stated | inferred | not_found;
#                 checked_skill + checked_hash: the dependency skill version the definition was checked against
#   deprecated_pt / deprecated_en   names that must not be used for this quantity any more
#   note          what the agent should say with it

version: 1
checked_on: "2026-11-18"

terms:
  - id: track
    kind: api
    api: {source: "Atlas track metadata (`var` of the AnnData; one row of `tracks`)"}
    label_pt: trilha
    label_en: track
    definition: The predicted signal of one biosample, assay and data source (and strand).
    unit: "normalized read signal (RNA-seq, CAGE); normalized insertion signal (DNase, ATAC)"
    comparable: A variant's two alleles within the same track.
    status: official
    source: {doc: "AlphaGenome docs, exploring_model_metadata.md, output types table", certainty: stated}
    deprecated_pt: ["medição", "medições"]
    deprecated_en: ["measurements of the same tissue", "tissue with one measurement", "two measurements"]
    note: A track is a prediction, not an experiment. Two tracks of one term differ in assay or source; they are not replicates.

  - id: biosample_term
    kind: api
    api: {source: "`ontology_curie` of a track (UBERON, CL, EFO, CLO)"}
    label_pt: termo (tecido, tipo celular ou linhagem)
    short_pt: tecido
    label_en: biosample term
    definition: The ontology term a track belongs to. It can be a tissue, a primary cell, a cell line or an in-vitro differentiated cell.
    unit: none
    comparable: n/a
    status: official
    source: {doc: "AlphaGenome docs, exploring_model_metadata.md", certainty: stated}
    note: The pages say "tecido" for short; a term may be a cell line.

  - id: assay_type
    kind: api
    api: {source: "`assay_title` of a track"}
    label_pt: ensaio
    label_en: assay type
    definition: The kind of experiment a track was trained on, such as polyA plus RNA-seq or total RNA-seq.
    unit: none
    comparable: n/a
    status: official
    source: {doc: "AlphaGenome docs, exploring_model_metadata.md", certainty: stated}
    note: Tracks of different assay types or sources are different kinds of track; their levels are not directly comparable.

  - id: scorer
    kind: api
    api: {source: "`requested_scorers` of the Atlas query (RNA_SEQ, RNA_SEQ_ACTIVE, CAGE, DNASE, ATAC)"}
    label_pt: tipo de predição
    label_en: scorer (prediction type)
    definition: The rule that turns the predicted tracks of the two alleles into one score per variant.
    unit: none
    comparable: n/a
    status: official
    source: {doc: "K-Dense alphagenome skill, references/model-api.md, Recommended scorers", certainty: stated, checked_skill: alphagenome, checked_hash: ff10c6aa5025f37b56f4f47558a8d6fb40348540626861ee0f3f1ad691b24616}
    deprecated_pt: ["tipo de sinal", "tipos de sinal"]

  - id: expression_lfc
    kind: api
    api: {scorer: RNA_SEQ, column: raw_score}
    label_pt: mudança prevista da expressão do gene
    label_en: predicted expression change (natural-log fold change)
    definition: How much the alternative allele changes the gene's predicted RNA-seq signal, compared with the reference allele, in one track.
    formula: "ln((mean_exons(ALT) + 0.001) / (mean_exons(REF) + 0.001))"
    unit: "none (natural log of a ratio)"
    comparable: Variants within the same track; not comparable with CAGE, DNase or ATAC scores.
    status: official
    source: {doc: "K-Dense alphagenome skill, references/model-api.md, Recommended scorers; AlphaGenome docs, variant_scoring.md", certainty: stated, checked_skill: alphagenome, checked_hash: ff10c6aa5025f37b56f4f47558a8d6fb40348540626861ee0f3f1ad691b24616}

  - id: percent_change
    kind: derived
    api: {field: "core.analysis.pct"}
    label_pt: mudança prevista (%)
    label_en: predicted percent change
    definition: The score written as a percent change of the signal it measures.
    formula: "100 * (e^score - 1) for RNA_SEQ; 100 * (2^score - 1) for CAGE, DNASE and ATAC"
    unit: "%"
    comparable: Within one prediction type.
    status: skill_convention
    source: {doc: "arithmetic on the scorer formula (scripts/core/analysis.py)", certainty: inferred}
    note: For a tissue or a group, the percent is computed on the mean of the log scores, so each tissue weighs the same.

  - id: expression_level
    kind: api
    api: {scorer: RNA_SEQ_ACTIVE, column: raw_score}
    label_pt: nível de expressão previsto
    short_pt: nível
    label_en: predicted expression level (active allele score)
    definition: The larger of the two alleles' mean predicted RNA-seq coverage over the gene's exons, in one track.
    formula: "max(mean_exons(ALT), mean_exons(REF))"
    unit: "no official unit (normalized read signal; not TPM)"
    comparable: The same gene across variants in one track, and across terms within one kind of track.
    status: official
    source: {doc: "K-Dense alphagenome skill, references/model-api.md, Recommended scorers; AlphaGenome docs, variant_scoring.md, Active-allele scorers", certainty: stated, checked_skill: alphagenome, checked_hash: ff10c6aa5025f37b56f4f47558a8d6fb40348540626861ee0f3f1ad691b24616}
    deprecated_pt: ["atividade do gene", "atividade prevista", "atividade basal", "atividade da variante", "mais ativo"]
    deprecated_en: ["gene activity", "baseline activity", "predicted activity", "the gene's activity"]
    note: It is a level, not a change, and exists only per variant. It equals the reference level when the variant does not raise expression, and is larger otherwise.

  - id: probe_snv
    kind: derived
    api: {field: "exploration.json: baseline_variant"}
    label_pt: variante de sondagem
    label_en: probe SNV
    definition: The single SNV in the middle of exon 1 that the exploration scores only to read the gene's level in every track.
    unit: none
    comparable: n/a
    status: skill_convention
    source: {doc: "scripts/explore.py, baseline_variant", certainty: stated}
    deprecated_pt: ["variante de referência"]
    note: It is arbitrary. The exploration does not measure how much it changes expression.

  - id: reference_level
    kind: derived
    api: {field: "core.analysis.reference_expression"}
    label_pt: nível de expressão previsto com o alelo de referência (REF)
    short_pt: REF
    label_en: reference expression level (REF)
    definition: The predicted expression level of the reference allele in a track, reconstructed from the two scores of the probe SNV.
    formula: "REF = ACTIVE when LFC <= 0; otherwise (ACTIVE + 0.001) * exp(-LFC) - 0.001"
    unit: "no official unit (same scale as the expression level)"
    comparable: As the expression level.
    status: skill_convention
    source: {doc: "algebra on the two scorer formulas (scripts/core/analysis.py)", certainty: inferred}
    note: REF also names the reference base of a variant; say "nível REF" when the level is meant.

  - id: share_of_maximum
    kind: derived
    api: {field: "exploration.json: activity.by_curie[*].relative"}
    label_pt: fração do máximo do gene
    short_pt: fração do máximo
    label_en: share of the gene's maximum
    definition: A term's mean expression level divided by the largest term mean of the gene in the catalogue.
    unit: none
    comparable: Terms whose tracks are of the same kind; the catalogue-wide maximum mixes kinds of track.
    status: skill_convention
    source: {doc: "scripts/explore.py, baseline_activity", certainty: stated}
    note: The mean of a term may mix assays and sources. Read the assay and source columns before comparing two terms.

  - id: relative_cut
    kind: derived
    api: {field: "exploration.json: activity.floor (default 0.05)"}
    label_pt: abaixo de 5% do máximo do gene
    label_en: below 5% of the gene's maximum
    definition: The exploration's flag for a term whose share of the maximum is under the cut.
    unit: none
    comparable: n/a
    status: skill_convention
    source: {doc: "scripts/explore.py, DEFAULT_FLOOR", certainty: stated}
    deprecated_pt: ["não expresso", "praticamente desligado", "gene desligado", "sem expressão", "quase desligado"]
    deprecated_en: ["not expressed", "gene is silent", "practically off"]
    note: Not calibrated, and no source gives an "expressed" threshold. It does not mean the transcript is absent.

  - id: ref_floor
    kind: derived
    api: {field: "Profile.ref_floor"}
    label_pt: piso do nível REF
    short_pt: Piso (REF)
    label_en: REF-level floor
    definition: A reference level chosen by the researcher below which a tissue is warned about, or left out of the control.
    unit: "no official unit (same scale as the expression level)"
    comparable: n/a
    status: skill_convention
    source: {doc: "scripts/core/analysis.py, expression_flags", certainty: stated}
    note: It is an absolute level, unlike the exploration's cut, which is a share of the maximum.

  - id: scorer_pseudocount
    kind: api
    api: {scorer: RNA_SEQ, column: "constant in the formula"}
    label_pt: pseudocontagem da pontuação RNA_SEQ (0,001)
    label_en: RNA_SEQ scorer pseudocount (0.001)
    definition: The constant added to both exon means in the RNA_SEQ log fold change.
    unit: "same scale as the expression level"
    comparable: n/a
    status: official
    source: {doc: "K-Dense alphagenome skill, references/model-api.md, Recommended scorers", certainty: stated, checked_skill: alphagenome, checked_hash: ff10c6aa5025f37b56f4f47558a8d6fb40348540626861ee0f3f1ad691b24616}
    deprecated_pt: ["pseudocount do modelo"]

  - id: quantile_score
    kind: api
    api: {scorer: "any", column: quantile_score}
    label_pt: quantil do Atlas
    label_en: quantile score
    definition: The rank of a raw score among common variants, for the same prediction type and the same track.
    unit: "none (-1 to 1 for signed scores, 0 to 1 otherwise)"
    comparable: Says how unusual a score is; the size of the effect is the raw score.
    status: official
    source: {doc: "AlphaGenome docs, faqs.md; K-Dense alphagenome skill, references/atlas.md, Raw, quantile, Phred", certainty: stated, checked_skill: alphagenome, checked_hash: ff10c6aa5025f37b56f4f47558a8d6fb40348540626861ee0f3f1ad691b24616}
    deprecated_en: ["ranks against the genome"]
    note: It is not a percentage and not a p-value. For RNA_SEQ_ACTIVE it ranks the level, not an effect.

  - id: local_lfc
    kind: api
    api: {scorer: "CAGE, DNASE, ATAC", column: raw_score}
    label_pt: mudança prevista do sinal local
    label_en: predicted local signal change (log2 fold change, 501 bp)
    definition: How much the alternative allele changes the predicted signal summed over 501 bp centred on the variant.
    formula: "log2((sum_501bp(ALT) + 1) / (sum_501bp(REF) + 1))"
    unit: "none (log2 of a ratio)"
    comparable: Variants within the same track; it belongs to no gene and is not comparable with RNA_SEQ scores.
    status: official
    source: {doc: "K-Dense alphagenome skill, references/model-api.md, Recommended scorers", certainty: stated, checked_skill: alphagenome, checked_hash: ff10c6aa5025f37b56f4f47558a8d6fb40348540626861ee0f3f1ad691b24616}

  - id: group_value
    kind: derived
    api: {field: "Profile.group_agg; columns target_mean, control_mean"}
    label_pt: valor do grupo
    label_en: group value
    definition: The mean (or median) over a group's tissues of each tissue's score; a tissue's score is the mean of its tracks.
    unit: "that of the score"
    comparable: Target against control, within one prediction type.
    status: skill_convention
    source: {doc: "scripts/core/analysis.py, compute", certainty: stated}

  - id: group_difference
    kind: derived
    api: {field: "column diff"}
    label_pt: diferença alvo − controle
    label_en: target − control difference
    definition: The target group value minus the control group value.
    unit: "that of the score"
    comparable: Within one prediction type.
    status: skill_convention
    source: {doc: "scripts/core/analysis.py, compute", certainty: stated}

  - id: track_disagreement
    kind: derived
    api: {field: "core.analysis.noise_model"}
    label_pt: discordância entre trilhas
    label_en: between-track disagreement
    definition: The absolute difference between the scores of two tracks of the same term, for the same variant.
    unit: "that of the score"
    comparable: n/a
    status: skill_convention
    source: {doc: "scripts/core/analysis.py, _pair_differences", certainty: stated}
    deprecated_pt: ["ruído", "ruídos"]
    deprecated_en: ["noise between measurements", "noise of the study"]
    note: The two tracks of a pair differ in assay or source; this is not replicate noise and says nothing about the model's error.

  - id: typical_disagreement
    kind: derived
    api: {field: "noise model column sigma; flag --min-sigma; column diff_sigma"}
    label_pt: discordância típica
    label_en: typical disagreement (robust scale)
    definition: The usual size of the between-track disagreement, by size of change.
    formula: "1.4826 * median(|a - b|) within each of five bins of the mean absolute score"
    unit: "that of the score"
    comparable: n/a
    status: skill_convention
    source: {doc: "scripts/core/analysis.py, noise_model", certainty: stated}
    deprecated_pt: ["σ"]
    note: The filter and the ordering divide the target − control difference by it. The code keeps the names sigma, --min-sigma and diff_sigma.

  - id: low_level_increase
    kind: derived
    api: {field: "n/a"}
    label_pt: aumento previsto a partir de um nível muito baixo
    label_en: predicted increase from a very low level
    definition: A positive expression change in a tissue whose reference level is close to the scorer pseudocount.
    unit: n/a
    comparable: n/a
    status: skill_convention
    source: {doc: "this skill", certainty: inferred}
    deprecated_pt: ["ativação ectópica"]
    deprecated_en: ["ectopic activation"]
    note: Give the reference and the alternative levels with it; a large percentage there can be a minimal absolute change.

  - id: avi_phred
    kind: api
    api: {scorer: AVI_SCORE, column: "avi_phred"}
    label_pt: AVI Phred
    label_en: AVI Phred
    definition: The Atlas overall variant-impact score on a Phred-like scale.
    unit: Phred-like
    comparable: Variants genome-wide; it does not say in which tissue.
    status: undecided
    source: {doc: "K-Dense alphagenome skill, references/atlas.md, AlphaGenome Variant Impact (AVI); the Atlas report was not read", certainty: not_found, checked_skill: alphagenome, checked_hash: ff10c6aa5025f37b56f4f47558a8d6fb40348540626861ee0f3f1ad691b24616}
    note: The scale and the meaning of each modality were not checked against a primary source.

undecided:
  - The unit of the expression level (RNA_SEQ_ACTIVE) and its relation to TPM or RPKM.
  - Whether expression levels of different assay types and sources can be compared.
  - Any threshold above which a gene counts as expressed.
  - Whether a low level makes predicted changes unreliable (the pseudocount alone shrinks them).
  - Whether the Atlas computes exactly the AlphaGenome 1 scorers, and with which model.
  - Whether one reference level applies to every variant of a window.
  - The background of the quantile in the Atlas, and what a mean of quantiles means.
  - The AVI Phred scale and the AVI modality names.
